<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetroChoice | Forklift & Pallet Detector</title>
  <style>
    :root {
      --bg: #f3f7fd;
      --card: #ffffff;
      --line: #d9e3f2;
      --txt: #12233f;
      --mut: #5d6f8c;
      --pri: #2563eb;
      --pri-h: #1d4ed8;
      --on-pri: #ffffff;
      --fork: #f59e0b;
      --pal: #2563eb;
      --shadow: 0 2px 10px rgba(37, 99, 235, .08);
    }

    [data-theme=dark] {
      --bg: #0b1220;
      --card: #131c2e;
      --line: #243250;
      --txt: #e6edf8;
      --mut: #8fa1c0;
      --pri: #3b82f6;
      --pri-h: #60a5fa;
      --on-pri: #ffffff;
      --fork: #fbbf24;
      --pal: #60a5fa;
      --shadow: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--txt);
      padding: 24px;
      transition: background .2s, color .2s;
    }

    .wrap {
      max-width: 1150px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--pri);
    }

    .sub {
      color: var(--mut);
      margin: 4px 0 20px;
      font-size: .9rem;
    }

    #theme {
      width: auto;
      margin: 0;
      padding: 8px 14px;
      background: var(--card);
      color: var(--txt);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      align-items: start;
    }

    @media (max-width:900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    #drop {
      border: 2px dashed var(--line);
      border-radius: 12px;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--mut);
      cursor: pointer;
      padding: 10px;
    }

    #drop:hover,
    #drop.over {
      border-color: var(--pri);
      background: rgba(37, 99, 235, .04);
    }

    canvas {
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }

    #strip {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
    }

    #strip img {
      height: 64px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: .7;
    }

    #strip img.on {
      border-color: var(--pri);
      opacity: 1;
    }

    label {
      font-size: .85rem;
      color: var(--mut);
      display: block;
      margin: 0 0 6px;
    }

    select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--txt);
      border: 1px solid var(--line);
      margin-bottom: 14px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--pri);
    }

    .val {
      color: var(--txt);
      font-weight: 600;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: .9rem;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--pri);
      color: var(--on-pri);
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--pri-h);
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    button.alt {
      background: transparent;
      color: var(--pri);
      border: 1px solid var(--pri);
    }

    button.alt:hover {
      background: rgba(37, 99, 235, .08) !important;
    }

    #msg {
      color: var(--mut);
      font-size: .8rem;
      margin-top: 10px;
      min-height: 1em;
    }

    #err {
      color: #ef4444;
      font-size: .85rem;
    }

    h3 {
      font-size: .95rem;
      margin: 18px 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h3 a {
      font-size: .8rem;
      color: var(--pri);
      text-decoration: none;
    }

    .h {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      font-size: .8rem;
      color: var(--mut);
    }

    .h img {
      width: 48px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
    }

    .h b {
      color: var(--txt);
      display: block;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Forklift & Pallet Detector</h1>
        <p class="sub">YOLO11s fine-tuned | 768 px | CPU inference</p>
      </div>
      <button id="theme">Dark mode</button>
    </div>
    <div class="grid">
      <div class="card">
        <div id="drop"><span id="hint">Drag & drop images here, or click to browse (multiple allowed)</span><canvas
            id="cv"></canvas></div>
        <div id="strip"></div>
        <input id="file" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="card">
        <label>Model</label>
        <select id="model"></select>
        <label>Confidence threshold: <span class="val" id="cv-val">0.35</span></label>
        <input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.35">
        <div style="margin-top:16px">
          <div class="stat"><span><span class="dot" style="background:var(--fork)"></span>Forklifts</span><b
              id="n-fork">-</b></div>
          <div class="stat"><span><span class="dot" style="background:var(--pal)"></span>Pallets</span><b
              id="n-pal">-</b></div>
          <div class="stat"><span>Inference time</span><b id="ms">-</b></div>
        </div>
        <button id="add" class="alt">+ Add images</button>
        <button id="save" disabled>Run & save to results</button>
        <div id="msg">Slider / model changes are previews only. New uploads are saved automatically.</div>
        <div id="err"></div>
        <h3>Recent results <a href="/results/report.html" target="_blank">Open full report</a></h3>
        <div id="hist"></div>
      </div>
    </div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const COLORS = { forklift: "#f59e0b", pallet: "#2563eb" };
    const root = document.documentElement;
    function setTheme(t) {
      root.dataset.theme = t; localStorage.setItem("theme", t);
      $("theme").textContent = t === "dark" ? "Light mode" : "Dark mode";
    }
    $("theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
    setTheme(localStorage.getItem("theme") || "light");
    let items = [], cur = null, timer = null;

    (async () => {
      const m = await (await fetch("/models")).json();
      $("model").innerHTML = m.models.map(n => `<option ${n === m.default ? "selected" : ""}>${n}</option>`).join("");
      history();
    })();

    $("drop").onclick = $("add").onclick = () => $("file").click();
    $("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
    $("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
    $("drop").ondragleave = () => $("drop").classList.remove("over");
    $("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); addFiles(e.dataTransfer.files); };
    $("save").onclick = () => cur && run(cur, true);
    $("model").onchange = () => cur && run(cur, false);
    $("conf").oninput = () => {
      $("cv-val").textContent = (+$("conf").value).toFixed(2);
      if (cur) { clearTimeout(timer); timer = setTimeout(() => run(cur, false), 400); }
    };

    async function addFiles(list) {
      const added = [...list].filter(f => f.type.startsWith("image/")).map(f => ({ file: f, url: URL.createObjectURL(f), data: null }));
      if (!added.length) return;
      items.push(...added);
      select(added[0]);
      for (const it of added) await run(it, true);
    }

    function select(it) {
      cur = it; $("save").disabled = false;
      if (!it.img) { it.img = new Image(); it.img.onload = show; it.img.src = it.url; } else show();
      strip();
    }

    function strip() {
      $("strip").innerHTML = "";
      items.forEach(it => {
        const im = document.createElement("img");
        im.src = it.url; im.title = it.file.name; im.className = it === cur ? "on" : "";
        im.onclick = () => select(it);
        $("strip").appendChild(im);
      });
    }

    function show() {
      if (!cur || !cur.img || !cur.img.complete) return;
      const dets = cur.data ? cur.data.detections : [], img = cur.img, cv = $("cv"), ctx = cv.getContext("2d");
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.style.display = "block"; $("hint").style.display = "none";
      ctx.drawImage(img, 0, 0);
      const lw = Math.max(2, cv.width / 300), fs = Math.max(12, cv.width / 50);
      ctx.lineWidth = lw; ctx.font = `bold ${fs}px sans-serif`;
      for (const d of dets) {
        const [x0, y0, x1, y1] = d.box, c = COLORS[d.label], t = `${d.label} ${d.conf.toFixed(2)}`;
        ctx.strokeStyle = c; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
        const w = ctx.measureText(t).width + 8;
        ctx.fillStyle = c; ctx.fillRect(x0, Math.max(0, y0 - fs - 4), w, fs + 4);
        ctx.fillStyle = d.label === "pallet" ? "#fff" : "#000"; ctx.fillText(t, x0 + 4, Math.max(fs, y0 - 6));
      }
      $("n-fork").textContent = cur.data ? dets.filter(d => d.label === "forklift").length : "-";
      $("n-pal").textContent = cur.data ? dets.filter(d => d.label === "pallet").length : "-";
      $("ms").textContent = cur.data ? cur.data.ms + " ms" : "-";
    }

    async function run(it, save) {
      $("save").disabled = true; $("save").textContent = "Detecting..."; $("err").textContent = "";
      const fd = new FormData();
      fd.append("file", it.file); fd.append("conf", $("conf").value); fd.append("model", $("model").value); fd.append("save", save);
      try {
        const res = await fetch("/predict", { method: "POST", body: fd });
        if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
        it.data = await res.json();
        if (it === cur) { show(); $("msg").textContent = it.data.saved ? "Saved to results/" + it.data.saved : "Preview only (not saved)"; }
        if (it.data.saved) history();
      } catch (e) { $("err").textContent = "Error: " + e.message; }
      $("save").disabled = false; $("save").textContent = "Run & save to results";
    }

    async function history() {
      const rows = await (await fetch("/history")).json();
      $("hist").innerHTML = rows.map(r => `<div class="h"><a href="/results/${r.folder}/annotated.jpg" target="_blank">
    <img src="/results/${r.folder}/annotated.jpg"></a><div><b>${r.image}</b>Forklifts ${r.forklifts} | Pallets ${r.pallets} | ${r.model}</div></div>`).join("");
    }
  </script>
</body>

</html>
